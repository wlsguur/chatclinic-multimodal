name: chatclinic
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch=2.5.1
  - torchvision=0.20.1
  - pytorch-cuda=12.1
  - fastapi>=0.115,<1.0
  - uvicorn>=0.30,<1.0
  - python-multipart>=0.0.9
  - pydantic>=2.8,<3.0
  - pysam>=0.23,<1.0
  - openpyxl>=3.1,<4.0
  - pillow>=10.0,<12.0
  - nibabel>=5.2,<6.0
  - numpy>=1.24,<3.0
  - pip
  - transformers==4.57.6
  # NOTE: vllm/transformers were removed — they are not imported anywhere in the
  # codebase (chat uses the OpenAI API over HTTP) and vllm==0.18.1 forced
  # torch==2.10.0 / torchvision==0.25.0, which is uninstallable and conflicts
  # with the pinned pytorch 2.5.1. Re-add under `pip:` only if a tool needs them.
