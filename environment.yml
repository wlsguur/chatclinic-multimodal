name: chatclinic
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch=2.5.1
  - torchvision=0.20.1
  - pytorch-cuda=12.1
  - fastapi>=0.115,<1.0
  - uvicorn>=0.30,<1.0
  - python-multipart>=0.0.9
  - pydantic>=2.8,<3.0
  - pysam>=0.23,<1.0
  - openpyxl>=3.1,<4.0
  - pillow>=10.0,<12.0
  - nibabel>=5.2,<6.0
  - numpy>=1.24,<2          # detectors (ultralytics/monai) require numpy<2; tested 1.26.4
  - git-lfs                 # lung_nodule_cxr_detector weight download (git lfs pull)
  - transformers==4.57.6
  - pip
  - pip:
      # --- Detection-topic model dependencies (tested versions noted) ---
      - ultralytics>=8.3      # gi_lesion_detector — YOLO11 (AGPL-3.0); tested 8.4.68
      - monai>=1.4            # lung_nodule_ct_detector — MONAI bundle; tested 1.5.2
      - SimpleITK>=2.3        # cxr/ct medical-image IO (DICOM/NIfTI/.mha); tested 2.5.5
  # NOTE: vllm was removed — not imported anywhere (chat uses the OpenAI API over
  # HTTP), and vllm==0.18.1 forced torch==2.10 / torchvision==0.25 (uninstallable,
  # conflicts with the pinned pytorch 2.5.1). The detectors run on torch 2.5.1
  # despite their per-plugin requirements suggesting >=2.7 (verified by inference).
